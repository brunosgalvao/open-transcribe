name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg clang libclang-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev
      - name: Configurar libclang
        run: |
          LIB=$(find /usr/lib -name 'libclang.so' -print -quit)
          if [ -n "$LIB" ]; then
            echo "LIBCLANG_PATH=$(dirname "$LIB")" >> "$GITHUB_ENV"
          fi
      - name: Testes (CPU)
        run: cargo test --release --no-default-features --lib

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar (Metal)
        run: cargo check --release --no-default-features --features metal --all-targets

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar (CPU)
        run: cargo check --release --no-default-features --all-targets
