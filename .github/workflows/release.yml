name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xz-utils clang libclang-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev
      - name: Configurar libclang
        run: |
          LIB=$(find /usr/lib -name 'libclang.so' -print -quit)
          if [ -n "$LIB" ]; then
            echo "LIBCLANG_PATH=$(dirname "$LIB")" >> "$GITHUB_ENV"
          fi
      - name: Baixar ffmpeg estático
        continue-on-error: true
        run: |
          curl -L --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          echo "FFMPEG_BIN=/tmp/ffmpeg-static/ffmpeg" >> "$GITHUB_ENV"
      - name: Gerar AppImage (CPU)
        run: bash packaging/build-appimage.sh --cpu
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/OpenTranscribe-CPU-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalar ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Gerar pacote Windows (CPU)
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Get-Command ffmpeg).Source
          ./packaging/build-windows.ps1 -Features cpu
      - name: Verificar pacote Windows (CPU)
        shell: pwsh
        run: |
          $stage = "dist/windows-CPU"
          $zip = "dist/OpenTranscribe-CPU-windows-x86_64.zip"
          if (-not (Test-Path $zip)) { throw "Zip não gerado: $zip" }
          $required = @("OpenTranscribe.exe", "llm-paragraph.exe", "llm-translate.exe", "ffmpeg.exe")
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $stage $file))) { throw "Faltando $file no pacote" }
          }
          $ffmpeg = Join-Path $stage "ffmpeg.exe"
          $size = (Get-Item $ffmpeg).Length
          if ($size -lt 1MB) { throw "ffmpeg.exe inválido ($size bytes)" }
          & $ffmpeg -version | Select-Object -First 1
          "### Windows CPU`nffmpeg.exe: $size bytes`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/OpenTranscribe-CPU-windows-x86_64.zip
          if-no-files-found: error

  windows-cuda:
    runs-on: windows-2022
    env:
      CMAKE_CUDA_ARCHITECTURES: "75-real;86-real;89-real;120-virtual"
      NVCC_PREPEND_FLAGS: "-Xcompiler /MD"
      CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço em disco
        shell: pwsh
        run: |
          Write-Host "Disco antes da limpeza:"
          Get-PSDrive C | Format-Table -AutoSize
          $paths = @(
            "C:\Android",
            "C:\Program Files (x86)\Android",
            "C:\Strawberry",
            "C:\ghcup",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\PyPy",
            "C:\hostedtoolcache\windows\go",
            "C:\Program Files\Google\Chrome",
            "C:\Program Files (x86)\Microsoft\Edge",
            "C:\Program Files\Mozilla Firefox",
            "C:\Program Files\dotnet",
            "C:\Program Files\Microsoft SDKs",
            "C:\Program Files (x86)\Microsoft SDKs"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "Removendo $path"
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $path
            }
          }
          Write-Host "Disco depois da limpeza:"
          Get-PSDrive C | Format-Table -AutoSize
      - name: Configurar MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalar LLVM (libclang)
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Instalar CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.0.0'
          method: 'local'
      - name: Verificar nvcc
        shell: pwsh
        run: |
          if (-not (Get-Command nvcc -ErrorAction SilentlyContinue)) { throw "nvcc não encontrado" }
          nvcc --version
      - name: Instalar ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Gerar pacote Windows CUDA
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Get-Command ffmpeg).Source
          $env:CUDAToolkit_ROOT = $env:CUDA_PATH
          $env:CMAKE_CUDA_COMPILER = Join-Path $env:CUDA_PATH "bin\nvcc.exe"
          $log = Join-Path $env:RUNNER_TEMP "windows-cuda-build.log"
          try {
            & ./packaging/build-windows.ps1 -Features cuda 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "build-windows.ps1 saiu com código $LASTEXITCODE" }
          } catch {
            $tail = (Get-Content $log -Tail 100 -ErrorAction SilentlyContinue) -join "`n"
            "### Falha no build Windows CUDA`n``````n$tail`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $short = $tail
            if ($short.Length -gt 1800) { $short = $short.Substring($short.Length - 1800) }
            Write-Host "::error title=Falha no build Windows CUDA::$(($short -replace "`r?`n", "%0A"))"
            throw
          }
      - name: Verificar pacote Windows CUDA
        shell: pwsh
        run: |
          $stage = "dist/windows-CUDA"
          $zip = "dist/OpenTranscribe-CUDA-windows-x86_64.zip"
          if (-not (Test-Path $zip)) { throw "Zip não gerado: $zip" }
          $required = @("OpenTranscribe.exe", "llm-paragraph.exe", "llm-translate.exe", "ffmpeg.exe")
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $stage $file))) { throw "Faltando $file no pacote" }
          }
          $ffmpeg = Join-Path $stage "ffmpeg.exe"
          $size = (Get-Item $ffmpeg).Length
          if ($size -lt 1MB) { throw "ffmpeg.exe inválido ($size bytes)" }
          & $ffmpeg -version | Select-Object -First 1
          foreach ($pattern in @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll")) {
            if (-not (Get-ChildItem $stage -Filter $pattern -ErrorAction SilentlyContinue)) {
              throw "Faltando $pattern no pacote"
            }
          }
          "### Windows CUDA`nffmpeg.exe: $size bytes`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cuda-zip
          path: dist/OpenTranscribe-CUDA-windows-x86_64.zip
          if-no-files-found: error

  linux-cuda:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:13.0.0-devel-ubuntu22.04
    env:
      CMAKE_CUDA_ARCHITECTURES: "75;80;86;89;120"
    steps:
      - name: Instalar git e ferramentas básicas
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates xz-utils file
      - uses: actions/checkout@v4
      - name: Instalar dependências de build
        run: |
          apt-get install -y build-essential cmake pkg-config clang libclang-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Instalar Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Baixar ffmpeg estático
        continue-on-error: true
        run: |
          curl -L --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          echo "FFMPEG_BIN=/tmp/ffmpeg-static/ffmpeg" >> "$GITHUB_ENV"
      - name: Gerar AppImage (CUDA)
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/cuda/bin:$PATH"
          LIB=$(find /usr/lib -name 'libclang.so' -print -quit)
          if [ -n "$LIB" ]; then
            export LIBCLANG_PATH=$(dirname "$LIB")
          fi
          bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cuda-appimage
          path: dist/OpenTranscribe-CUDA-x86_64.AppImage
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalar ffmpeg
        run: brew install ffmpeg dylibbundler
      - name: Importar certificado Apple
        if: env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_CERTIFICATE" | base64 -D > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12
      - name: Gerar DMG (Metal)
        run: FFMPEG_BIN="$(command -v ffmpeg)" bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/OpenTranscribe-macos-*.dmg
          if-no-files-found: error

  release:
    needs: [linux, windows, macos, linux-cuda, windows-cuda]
    if: always() && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux-cuda.result == 'success' && needs.windows-cuda.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
