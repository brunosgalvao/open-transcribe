[package]
name = "open-transcribe"
version = "0.1.1"
edition = "2024"
description = "Transcrição local de vídeos e aulas com Whisper e parágrafos por LLM local."
authors = ["Bruno Galvão"]
license = "MIT"
repository = "https://github.com/brunosgalvao/open-transcribe"
readme = "README.md"
keywords = ["whisper", "transcription", "egui", "llama"]
categories = ["audio", "multimedia"]

[features]
default = ["cuda"]
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]
metal = ["whisper-rs/metal"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
llama-cpp-2 = { version = "0.1.160", default-features = false }
libloading = "0.8"
egui = "0.37.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2", "charset", "json"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
whisper-rs = "0.16.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
